; Ghost Aquarium: one codebase for the Wokwi simulator, the real ESP32-S3, and laptop tests.
; See docs/adr/0004-toolchain-platformio-wokwi.md

[platformio]
default_envs = esp32s3

; ESP32-S3-DevKitC-1 N8R8 (8 MB flash, 8 MB octal PSRAM). Used for the firmware and Wokwi.
[env:esp32s3]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino
board_build.arduino.memory_type = qio_opi
build_unflags = -std=gnu++11
build_flags = -std=gnu++17 -Wall -Wextra -DBOARD_HAS_PSRAM
lib_deps = lovyan03/LovyanGFX@^1.2.0
monitor_speed = 115200

; Laptop-only: runs the Unity tests for lib/tanksim (ADR 0006). The Arduino src/ is excluded.
[env:native]
platform = native
test_framework = unity
build_flags = -std=c++17 -Wall -Wextra
build_src_filter = -<*>
