<svg xmlns="http://www.w3.org/2000/svg" width="400" height="340" color="#14211c" viewBox="0 0 400 340" role="img" aria-label="Top view: the phone lies with its camera end toward the viewer; the hood's back wall sits 5 millimetres beyond the 27 millimetre window, side walls either side, open toward the viewer."><style>
