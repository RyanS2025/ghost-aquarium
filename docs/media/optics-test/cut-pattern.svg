<svg xmlns="http://www.w3.org/2000/svg" width="680" height="290" color="#14211c" viewBox="0 0 680 290" role="img" aria-label="Cut pattern: a 160 by 50 millimetre strip folded at 50 and 110 millimetres, with a 45 degree guide line on each side panel; a 60 by 50 roof; a 58 by 71 clear sheet."><style>
text{font-family:ui-monospace,Menlo,Consolas,monospace}
.t{font-size:12px;fill:#14211c}.tm{font-size:12px;fill:#536660}.tg{font-size:12px;fill:#08808c;font-weight:600}
.g-stroke{stroke:#08808c}.g-fill{fill:#08808c}.g-soft{fill:rgba(8,128,140,.14)}.panel{fill:#e0e7e3}.mask{fill:#1b2420}.muted-stroke{stroke:#536660}
</style><rect width="680" height="290" fill="#f7faf8"/>
              <rect x="40" y="50" width="320" height="100" class="panel" stroke="currentColor" stroke-width="1.5"/>
              <line x1="140" y1="50" x2="140" y2="150" stroke="currentColor" stroke-width="1.5" stroke-dasharray="6 4"/>
              <line x1="260" y1="50" x2="260" y2="150" stroke="currentColor" stroke-width="1.5" stroke-dasharray="6 4"/>
              <line x1="140" y1="150" x2="40" y2="50" class="g-stroke" stroke-width="2"/>
              <line x1="260" y1="150" x2="360" y2="50" class="g-stroke" stroke-width="2"/>
              <text x="48" y="140" class="t">side</text>
              <text x="200" y="98" class="t" text-anchor="middle">back</text>
              <text x="200" y="114" class="tm" text-anchor="middle">most important to black out</text>
              <text x="352" y="140" class="t" text-anchor="end">side</text>
              <text x="90" y="40" class="tm" text-anchor="middle">50</text>
              <text x="200" y="40" class="tm" text-anchor="middle">60</text>
              <text x="310" y="40" class="tm" text-anchor="middle">50</text>
              <text x="30" y="104" class="tm" text-anchor="end">50</text>
              <text x="200" y="172" class="tm" text-anchor="middle">bottom edge rests on the phone · 160 mm long</text>
              <rect x="400" y="50" width="120" height="100" class="panel" stroke="currentColor" stroke-width="1.5"/>
              <text x="460" y="98" class="t" text-anchor="middle">roof</text>
