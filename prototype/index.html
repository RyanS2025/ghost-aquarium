<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ghost Aquarium Tuner</title>
<!--
  Ghost Aquarium tuning prototype (ADR 0007), look v2: flowing bodies, vibrant palettes, splashes.
  A JS stand-in for the motion model, used to choose the look by feel. Once the values are
  exported, lib/tanksim (C++) is the source of truth.
  Single file, no build step, no external libraries.
-->
<style>
  :root {
    --bg: #06080c; --panel: #0c1017; --line: #1a2230; --text: #c9d4e3;
    --muted: #6b7a90; --accent: #ff4fd8; --accent2: #3fe0ff;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--text);
    font: 13px/1.4 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  }
  header { padding: 18px 16px 0; text-align: center; }
  header h1 {
    margin: 0; font-size: 15px; letter-spacing: .12em;
    background: linear-gradient(90deg, var(--accent2), var(--accent)); -webkit-background-clip: text; background-clip: text; color: transparent;
  }
  header p { margin: 4px 0 0; color: var(--muted); }
  main { display: flex; flex-wrap: wrap; gap: 24px; padding: 18px 16px 32px; justify-content: center; align-items: flex-start; }
  .stage { display: flex; flex-direction: column; gap: 10px; align-items: center; min-width: 0; }
  .glass {
    padding: 14px; border: 1px solid var(--line); border-radius: 6px;
    background: linear-gradient(180deg, #0a0e15, #040507);
    box-shadow: 0 0 80px rgba(63, 224, 255, .05), 0 0 120px rgba(255, 79, 216, .04);
  }
  canvas {
    display: block; width: 960px; max-width: calc(100vw - 64px); aspect-ratio: 4 / 3;
    background: #000; cursor: crosshair; touch-action: manipulation;
  }
  canvas.pixel { image-rendering: pixelated; }
  canvas.mirror { transform: scaleX(-1); }
  .hud { display: flex; flex-wrap: wrap; gap: 8px 18px; color: var(--muted); justify-content: center; }
  .hud b { color: var(--text); font-weight: normal; }
  .hint { color: var(--accent2); }
  aside {
    width: 380px; max-width: 100%; background: var(--panel); border: 1px solid var(--line);
    border-radius: 6px; padding: 14px; max-height: calc(100vh - 40px); overflow: auto;
  }
  fieldset { border: 1px solid var(--line); border-radius: 4px; margin: 0 0 12px; padding: 6px 10px 8px; }
  legend { color: var(--accent2); padding: 0 4px; }
  fieldset.fx legend { color: var(--accent); }
  .row { display: grid; grid-template-columns: 1fr 120px 48px; gap: 8px; align-items: center; margin: 3px 0; }
  .row label { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .row output { text-align: right; color: var(--muted); }
  .pal { display: grid; grid-template-columns: 1fr 34px 34px 70px; gap: 6px; align-items: center; margin: 3px 0; }
  .pal input[type=color] { width: 34px; height: 22px; border: 1px solid var(--line); background: none; padding: 0; }
  .swatch { height: 10px; border-radius: 5px; }
  input[type=range] { width: 100%; accent-color: var(--accent); }
  label.check { display: flex; gap: 8px; align-items: center; margin: 4px 0; }
  button {
    background: #151d28; color: var(--text); border: 1px solid var(--line); border-radius: 4px;
    padding: 6px 10px; font: inherit; cursor: pointer;
  }
  button:hover { border-color: var(--accent); }
  .btns { display: flex; gap: 8px; flex-wrap: wrap; margin: 8px 0; }
  textarea {
    width: 100%; height: 300px; background: #040507; color: #9fd8ff; border: 1px solid var(--line);
    border-radius: 4px; font: 11px/1.35 ui-monospace, Menlo, monospace; padding: 8px; resize: vertical;
  }
  #copied { color: var(--accent); min-height: 1.4em; }
</style>
</head>
<body>
<header>
  <h1>GHOST AQUARIUM · TUNER</h1>
  <p>320×240 logical · pure black is invisible in the reflection · tune by feel, then “Copy as C++”</p>
</header>
<main>
  <section class="stage">
    <div class="glass"><canvas id="tank"></canvas></div>
    <div class="hud">
      <span class="hint">tap the tank to make a splash</span>
      <span>fps <b id="fps">–</b></span>
      <span>fish <b id="nfish">–</b></span>
      <span>particles <b id="npart">–</b></span>
      <span>seed <b id="seed">–</b></span>
    </div>
  </section>
  <aside>
    <fieldset>
      <legend>View</legend>
      <label class="check"><input type="checkbox" id="pixel"> Pixel-accurate (exact 320×240 grid)</label>
      <label class="check"><input type="checkbox" id="mirror"> Mirror (how it looks on the reflector)</label>
      <div class="btns">
        <button id="leap">Make a fish leap</button>
        <button id="reseed">Reseed</button>
        <button id="reset">Reset defaults</button>
      </div>
    </fieldset>
    <div id="controls"></div>
    <fieldset>
      <legend>Fish palettes (head → tail)</legend>
      <div id="palettes"></div>
    </fieldset>
    <fieldset>
      <legend>Scene colors</legend>
      <div id="colors"></div>
    </fieldset>
    <fieldset>
      <legend>Export</legend>
      <div class="btns"><button id="copy">Copy as C++</button></div>
      <div id="copied"></div>
      <textarea id="export" readonly spellcheck="false"></textarea>
    </fieldset>
  </aside>
</main>
<script>
"use strict";

// ================================================================ constants
const W = 320, H = 240;
const STEP = 1 / 60, MAX_STEPS = 5;           // fixed 60 Hz, ≤5 catch-up steps
const SURFACE_Y = 20;                         // water line (logical px)
const GRAVITY = 170;                          // px/s² above water and for droplets
const LAYER_NAMES = ["Far", "Mid", "Near"];
const SPECIES = [                              // species index == layer in v1
  { right: "><>",      left: "<><" },
  { right: "><('>",    left: "<')><" },
  { right: "><((('>",  left: "<')))><" },
];
const FONT_PX = [8, 10, 13];
const MAX_PARTICLES = 320, MAX_RIPPLES = 24, BUBBLE_CAP = 64, HIST_CAP = 260;   // px of path kept: body + longest wake
const SEAWEED_COUNT = 6, SEAWEED_SEG_PX = 7, PLANKTON = 36;
const TAU = Math.PI * 2;
const HOME_MIN = SURFACE_Y + 35, HOME_MAX = H - 35;

// Core fields: ORDER MUST match struct tank::Tuning in lib/tanksim/tuning.h.
// Fields with fx:true are new in look v2 and get exported as a separate draft block.
const FIELDS = [
  { k: "maxSpeed",         g: "Motion",    def: [18, 30, 44], min: 2, max: 90, step: 1, sub: LAYER_NAMES },
  { k: "maxForce",         g: "Motion",    def: 38,  min: 2,  max: 150, step: 1 },
  { k: "neighborRadius",   g: "Schooling", def: 56,  min: 4,  max: 140, step: 1 },
  { k: "separationRadius", g: "Schooling", def: 30,  min: 2,  max: 80,  step: 1 },
  { k: "cohesionWeight",   g: "Schooling", def: 0.5, min: 0,  max: 4,   step: 0.05 },
  { k: "alignmentWeight",  g: "Schooling", def: 1.0, min: 0,  max: 4,   step: 0.05 },
  { k: "separationWeight", g: "Schooling", def: 1.8, min: 0,  max: 4,   step: 0.05 },
  { k: "wanderWeight",     g: "Wander & edges", def: 0.9, min: 0, max: 3,  step: 0.05 },
  { k: "wanderJitter",     g: "Wander & edges", def: 2.4, min: 0, max: 12, step: 0.1 },
  { k: "edgeMargin",       g: "Wander & edges", def: 30,  min: 4, max: 80, step: 1 },
  { k: "edgeWeight",       g: "Wander & edges", def: 2.5, min: 0, max: 8,  step: 0.1 },
  { k: "facingThreshold",  g: "Wander & edges", def: 3,   min: 0, max: 15, step: 0.5 },
  { k: "fishPerLayer",     g: "Population", def: [6, 5, 3], min: 0, max: 20, step: 1, sub: LAYER_NAMES, int: true, respawn: true },
  { k: "bubblesPerSec",    g: "Bubbles",   def: 1.5, min: 0,  max: 10,  step: 0.1 },
  { k: "bubbleRise",       g: "Bubbles",   def: 25,  min: 2,  max: 80,  step: 1 },
  { k: "bubbleWobbleAmp",  g: "Bubbles",   def: 2,   min: 0,  max: 10,  step: 0.25 },
  { k: "bubbleWobbleHz",   g: "Bubbles",   def: 1.2, min: 0,  max: 5,   step: 0.05 },
  { k: "seaweedSwayAmp",   g: "Seaweed",   def: 7,   min: 0,  max: 20,  step: 0.5 },
  { k: "seaweedHz",        g: "Seaweed",   def: [0.31, 0.83], min: 0, max: 2, step: 0.01, sub: ["slow", "fast"] },
  // ---- look v2 (draft; DESIGN update pending)
  { k: "bodyWaveAmp",      g: "Flow", fx: true, def: 2.2,  min: 0, max: 8,   step: 0.1 },
  { k: "bodyWaveHz",       g: "Flow", fx: true, def: 1.4,  min: 0, max: 5,   step: 0.05 },
  { k: "levelPull",        g: "Flow", fx: true, def: 0.7,  min: 0, max: 3,   step: 0.05 },
  { k: "depthPull",        g: "Flow", fx: true, def: 0.8,  min: 0, max: 2,   step: 0.05 },
  { k: "wakeLength",       g: "Flow", fx: true, def: 6,    min: 0, max: 16,  step: 1, int: true },
  { k: "vibrance",         g: "Color", fx: true, def: 1.0, min: 0, max: 1.6, step: 0.05 },
  { k: "shimmer",          g: "Color", fx: true, def: 0.12, min: 0, max: 0.4, step: 0.01 },
  { k: "dartPerSec",       g: "Splashes", fx: true, def: 0.035, min: 0, max: 0.3, step: 0.005 },
  { k: "leapPerSec",       g: "Splashes", fx: true, def: 0.08,  min: 0, max: 1,   step: 0.01 },
  { k: "splashDroplets",   g: "Splashes", fx: true, def: 16,    min: 0, max: 48,  step: 1, int: true },
  { k: "plankton",         g: "Splashes", fx: true, def: 1,     min: 0, max: 1,   step: 1, int: true },
];

const DEFAULT_PALETTES = [                    // vibrant tropical, [head, tail]
  ["#00f0ff", "#ff2d55"],  // neon tetra
  ["#ff2bd6", "#7a3cff"],  // betta
  ["#ffd400", "#ff5a00"],  // goldfish
  ["#ff8c00", "#fff1d6"],  // clownfish
  ["#b6ff00", "#00d5a0"],  // lime / teal
  ["#ff5e7a", "#ffc46b"],  // coral
  ["#5ad1ff", "#b07bff"],  // sky / lilac
];
const DEFAULT_SCENE = { seaweedBase: "#0d5c3a", seaweedTip: "#7dff6a", bubble: "#9fe8ff", surface: "#2fb8ff", plankton: "#3a5f86" };

// ================================================================ state
const STORE_KEY = "ghost-aquarium-tuner-v2";
const clone = (o) => JSON.parse(JSON.stringify(o));
const defaultsT = () => Object.fromEntries(FIELDS.map((f) => [f.k, clone(f.def)]));
let T = defaultsT(), palettes = clone(DEFAULT_PALETTES), scene = clone(DEFAULT_SCENE), seed = 42;
try {
  const s = JSON.parse(localStorage.getItem(STORE_KEY) || "null");
  if (s) { T = Object.assign(defaultsT(), s.T); palettes = s.palettes || palettes; scene = Object.assign(clone(DEFAULT_SCENE), s.scene); seed = s.seed ?? seed; }
} catch (_) { /* storage unavailable: defaults */ }
const save = () => { try { localStorage.setItem(STORE_KEY, JSON.stringify({ T, palettes, scene, seed })); } catch (_) {} };

// ================================================================ math + color
const v = (x = 0, y = 0) => ({ x, y });
const len = (a) => Math.hypot(a.x, a.y);
const norm = (a) => { const l = len(a); return l < 1e-6 ? v() : v(a.x / l, a.y / l); };
const limit = (a, m) => { const l = len(a); return l > m && l > 0 ? v(a.x / l * m, a.y / l * m) : a; };
const clamp = (x, a, b) => Math.max(a, Math.min(b, x));

class Rng {                                    // xorshift32, same as tank::Rng
  constructor(s) { this.s = (s >>> 0) || 0x9E3779B9; }
  next() { let x = this.s; x ^= x << 13; x >>>= 0; x ^= x >>> 17; x ^= x << 5; x >>>= 0; this.s = x; return x; }
  uniform(lo, hi) { return lo + (hi - lo) * ((this.next() >>> 8) / 16777216); }
  int(n) { return Math.floor(this.uniform(0, n)); }
}

function hexToHsl(hex) {
  const n = parseInt(hex.slice(1), 16);
  const r = ((n >> 16) & 255) / 255, g = ((n >> 8) & 255) / 255, b = (n & 255) / 255;
  const mx = Math.max(r, g, b), mn = Math.min(r, g, b), l = (mx + mn) / 2;
  if (mx === mn) return [0, 0, l];
  const d = mx - mn, s = l > 0.5 ? d / (2 - mx - mn) : d / (mx + mn);
  let h = mx === r ? (g - b) / d + (g < b ? 6 : 0) : mx === g ? (b - r) / d + 2 : (r - g) / d + 4;
  return [h * 60, s, l];
}
const lerpHue = (a, b, t) => { let d = ((b - a + 540) % 360) - 180; return (a + d * t + 360) % 360; };
const hsl = (h, s, l, a = 1) => `hsla(${h.toFixed(1)},${(clamp(s, 0, 1) * 100).toFixed(1)}%,${(clamp(l, 0, 1) * 100).toFixed(1)}%,${a.toFixed(3)})`;

// Depth grading: far fish are darker, less saturated and pulled toward deep blue.
const DEPTH = [
  { l: 0.50, s: 0.75, blue: 0.35 },
  { l: 0.78, s: 0.92, blue: 0.10 },
  { l: 1.00, s: 1.00, blue: 0.00 },
];

// ================================================================ simulation
function makeTank(s) {
  const rng = new Rng(s);
  const fish = [];
  let id = 0;
  for (let L = 0; L < 3; L++) {
    for (let i = 0; i < T.fishPerLayer[L]; i++) {
      const a = rng.uniform(-0.6, 0.6) + (rng.uniform(0, 1) < 0.5 ? 0 : Math.PI), sp = T.maxSpeed[L] * 0.6;
      fish.push({
        id: id++, layer: L, pal: rng.int(palettes.length),
        pos: v(rng.uniform(T.edgeMargin, W - T.edgeMargin), rng.uniform(SURFACE_Y + T.edgeMargin, H - T.edgeMargin)),
        vel: v(Math.cos(a) * sp, Math.sin(a) * sp),
        wanderAngle: a, facingRight: Math.cos(a) > 0, wavePhase: rng.uniform(0, TAU),
        boostT: 0, leapT: 0, airborne: false, hist: [],
        homeY: rng.uniform(HOME_MIN, HOME_MAX),   // preferred depth; drifts slowly so fish use the whole tank
      });
    }
  }
  const seaweed = [];
  for (let i = 0; i < SEAWEED_COUNT; i++) {
    seaweed.push({ x: W * (0.07 + 0.86 * i / (SEAWEED_COUNT - 1)) + rng.uniform(-10, 10), height: rng.uniform(45, 110), phase: rng.uniform(0, TAU) });
  }
  const plankton = [];
  for (let i = 0; i < PLANKTON; i++) {
    plankton.push({ pos: v(rng.uniform(0, W), rng.uniform(SURFACE_Y, H)), vel: v(rng.uniform(-3, 3), rng.uniform(-2, 2)), phase: rng.uniform(0, TAU) });
  }
  return { rng, fish, seaweed, plankton, bubbles: [], particles: [], ripples: [], time: 0, bubbleAcc: 0 };
}

function steerEdges(f) {
  const m = T.edgeMargin, k = T.edgeWeight * T.maxForce;
  const fac = (d) => (d < 0 ? 1 : clamp((m - d) / m, 0, 1));
  const top = f.leapT > 0 ? 0 : fac(f.pos.y - SURFACE_Y);   // a leaping fish ignores the surface
  return v(fac(f.pos.x) * k - fac(W - f.pos.x) * k, top * k - fac(H - f.pos.y) * k);
}

function steerWander(f, rng, dt) {
  f.wanderAngle += rng.uniform(-1, 1) * T.wanderJitter * dt;
  const m = T.wanderWeight * T.maxForce;
  return v(Math.cos(f.wanderAngle) * m, Math.sin(f.wanderAngle) * m);
}

// One possible schooling rule, just for tuning. The C++ version is written separately (plan Task 4).
function steerSchool(f, all) {
  const sep = v(), avgVel = v(), center = v();
  let n = 0;
  for (const o of all) {
    if (o === f || o.layer !== f.layer || o.airborne) continue;
    const dx = f.pos.x - o.pos.x, dy = f.pos.y - o.pos.y, d = Math.hypot(dx, dy);
    if (d > T.neighborRadius) continue;
    n++;
    avgVel.x += o.vel.x; avgVel.y += o.vel.y; center.x += o.pos.x; center.y += o.pos.y;
    if (d < T.separationRadius && d > 1e-4) {
      const w = (T.separationRadius - d) / T.separationRadius / d;
      sep.x += dx * w; sep.y += dy * w;
    }
  }
  if (n === 0) return v();
  const ms = T.maxSpeed[f.layer];
  const seek = (dir) => { const u = norm(dir); return len(u) === 0 ? v() : v(u.x * ms - f.vel.x, u.y * ms - f.vel.y); };
  const s = seek(sep), a = seek(v(avgVel.x / n, avgVel.y / n)), c = seek(v(center.x / n - f.pos.x, center.y / n - f.pos.y));
  return v(T.separationWeight * s.x + T.alignmentWeight * a.x + T.cohesionWeight * c.x,
           T.separationWeight * s.y + T.alignmentWeight * a.y + T.cohesionWeight * c.y);
}

// ---------------------------------------------------------------- particles + splashes
function emit(tk, p) { if (tk.particles.length < MAX_PARTICLES) tk.particles.push(p); }
function ripple(tk, x, amp) { if (tk.ripples.length >= MAX_RIPPLES) tk.ripples.shift(); tk.ripples.push({ x, t0: tk.time, amp }); }
function surfaceAt(tk, x) {
  let y = SURFACE_Y + 1.2 * Math.sin(x * 0.07 + tk.time * 1.3) + 0.6 * Math.sin(x * 0.19 - tk.time * 0.9);
  for (const r of tk.ripples) {
    const age = tk.time - r.t0, d = Math.abs(x - r.x);
    if (d < 70 * age) y += r.amp * Math.exp(-age * 1.1) * Math.exp(-d * 0.018) * Math.sin(0.28 * d - 8 * age);
  }
  return y;
}
function fishColorHead(f) { return palettes[f.pal % palettes.length][0]; }

function splash(tk, x, strength, color) {
  const rng = tk.rng, s = clamp(strength / 60, 0.4, 1.6);
  const n = Math.round(T.splashDroplets * s);
  for (let i = 0; i < n; i++) {
    emit(tk, { kind: "drop", pos: v(x + rng.uniform(-5, 5), SURFACE_Y - 1), vel: v(rng.uniform(-38, 38) * s, -rng.uniform(35, 85) * s),
               life: rng.uniform(0.7, 1.3), max: 1.3, color: rng.uniform(0, 1) < 0.35 ? color : scene.bubble, ch: rng.uniform(0, 1) < 0.5 ? "'" : "." });
  }
  for (let i = 0; i < Math.round(6 * s); i++) {
    emit(tk, { kind: "spark", pos: v(x + rng.uniform(-8, 8), SURFACE_Y + rng.uniform(-2, 2)), vel: v(rng.uniform(-25, 25), rng.uniform(-10, 10)),
               life: rng.uniform(0.25, 0.5), max: 0.5, color: "#ffffff", ch: "*" });
  }
  for (let i = 0; i < Math.round(5 * s); i++) {
    emit(tk, { kind: "bubble", pos: v(x + rng.uniform(-6, 6), SURFACE_Y + rng.uniform(4, 14)), vel: v(rng.uniform(-6, 6), rng.uniform(5, 25)),
               life: rng.uniform(0.8, 1.6), max: 1.6, color: scene.bubble, ch: rng.uniform(0, 1) < 0.5 ? "o" : "." });
  }
  ripple(tk, x, 3.2 * s);
}

function burst(tk, x, y) {                      // tap underwater: sparkles + scatter nearby fish
  const rng = tk.rng;
  for (let i = 0; i < 26; i++) {
    const a = rng.uniform(0, TAU), sp = rng.uniform(20, 75);
    const pal = palettes[rng.int(palettes.length)];
    emit(tk, { kind: "spark", pos: v(x, y), vel: v(Math.cos(a) * sp, Math.sin(a) * sp), life: rng.uniform(0.5, 1.1), max: 1.1,
               color: pal[rng.int(2)], ch: rng.uniform(0, 1) < 0.5 ? "*" : "+" });
  }
  for (let i = 0; i < 6; i++) emit(tk, { kind: "bubble", pos: v(x + rng.uniform(-4, 4), y), vel: v(rng.uniform(-8, 8), -rng.uniform(10, 30)), life: 2, max: 2, color: scene.bubble, ch: "o" });
  for (const f of tk.fish) {
    const d = v(f.pos.x - x, f.pos.y - y), dist = len(d);
    if (dist < 75 && !f.airborne) { const u = dist < 1e-3 ? v(1, 0) : norm(d); const sp = T.maxSpeed[f.layer] * 2.4; f.vel = v(u.x * sp, u.y * sp); f.boostT = 0.7; }
  }
}

function startLeap(tk, f) {
  const ms = T.maxSpeed[f.layer];
  const dir = f.vel.x >= 0 ? 1 : -1;
  f.leapT = 2.2; f.boostT = 1.2;
  f.vel = v(dir * ms * 1.3, -Math.max(95, Math.sqrt(2 * GRAVITY * Math.max(0, f.pos.y - SURFACE_Y + 25))));
}

function tryAutoLeap(tk) {
  const cands = tk.fish.filter((f) => f.layer > 0 && !f.airborne && f.leapT <= 0 && f.pos.y < SURFACE_Y + 110);
  if (cands.length) startLeap(tk, cands[tk.rng.int(cands.length)]);
}

// ---------------------------------------------------------------- step
function step(tk, dt) {
  const rng = tk.rng;
  // 1) forces from one snapshot (order-independent)
  const forces = tk.fish.map((f) => {
    if (f.airborne) return v(0, GRAVITY);
    const a = steerSchool(f, tk.fish), b = steerEdges(f), c = steerWander(f, rng, dt);
    // Real fish swim level and hold a preferred depth; without the depth pull they drift
    // to the margins and glide along the walls.
    f.homeY = clamp(f.homeY + rng.uniform(-1, 1) * 10 * dt, HOME_MIN, HOME_MAX);
    const level = v(0, -f.vel.y * T.levelPull * 2 + (f.homeY - f.pos.y) * T.depthPull * 0.5);
    return f.leapT > 0 ? v(c.x * 0.3, 0) : v(a.x + b.x + c.x + level.x, a.y + b.y + c.y + level.y);
  });
  // 2) integrate + events
  tk.fish.forEach((f, i) => {
    const ms = T.maxSpeed[f.layer];
    if (f.airborne) {
      f.vel.x += forces[i].x * dt; f.vel.y += forces[i].y * dt;
    } else {
      const s = limit(forces[i], T.maxForce * (f.boostT > 0 ? 3 : 1));
      f.vel = v(f.vel.x + s.x * dt, f.vel.y + s.y * dt);
      if (f.leapT <= 0) f.vel = limit(f.vel, ms * (1 + 1.4 * clamp(f.boostT / 0.7, 0, 1)));
    }
    f.pos.x += f.vel.x * dt; f.pos.y += f.vel.y * dt;
    f.boostT = Math.max(0, f.boostT - dt); f.leapT = Math.max(0, f.leapT - dt);
    if (Math.abs(f.vel.x) > T.facingThreshold) f.facingRight = f.vel.x > 0;
    const speed = len(f.vel);
    f.wavePhase += TAU * T.bodyWaveHz * (0.4 + 0.9 * clamp(speed / ms, 0, 2.5)) * dt;

    // surface crossings → splashes
    const surf = SURFACE_Y;
    if (!f.airborne && f.pos.y < surf && f.vel.y < 0) { f.airborne = true; splash(tk, f.pos.x, Math.abs(f.vel.y), fishColorHead(f)); }
    else if (f.airborne && f.pos.y >= surf && f.vel.y > 0) {
      f.airborne = false; f.leapT = 0; f.vel.y *= 0.35; f.vel.x *= 0.8; f.boostT = 0.4;
      splash(tk, f.pos.x, f.vel.y * 2.6 + 40, fishColorHead(f));
    }
    // random darts leave a bubble spray
    if (!f.airborne && f.leapT <= 0 && rng.uniform(0, 1) < T.dartPerSec * dt) {
      const u = len(f.vel) > 1e-3 ? norm(f.vel) : v(f.facingRight ? 1 : -1, 0);
      f.vel = v(u.x * ms * 2.3, u.y * ms * 2.3); f.boostT = 0.7;
      for (let k = 0; k < 7; k++) emit(tk, { kind: "bubble", pos: v(f.pos.x - u.x * 10, f.pos.y), vel: v(-u.x * rng.uniform(10, 30), rng.uniform(-12, 4)), life: rng.uniform(0.8, 1.6), max: 1.6, color: scene.bubble, ch: rng.uniform(0, 1) < 0.6 ? "." : "o" });
    }
    // body history, stored by distance so body length doesn't depend on speed
    const last = f.hist[f.hist.length - 1];
    if (!last || Math.hypot(f.pos.x - last.x, f.pos.y - last.y) >= 1) { f.hist.push(v(f.pos.x, f.pos.y)); if (f.hist.length > HIST_CAP) f.hist.shift(); }
  });
  if (rng.uniform(0, 1) < T.leapPerSec * dt) tryAutoLeap(tk);

  // 3) ambient bubbles (pop at the surface with a tiny ripple)
  tk.bubbleAcc += T.bubblesPerSec * dt;
  while (tk.bubbleAcc >= 1) {
    tk.bubbleAcc -= 1;
    if (tk.bubbles.length < BUBBLE_CAP) tk.bubbles.push({ pos: v(rng.uniform(8, W - 8), H + 2), phase: rng.uniform(0, TAU), rise: T.bubbleRise * rng.uniform(0.8, 1.2) });
  }
  for (const b of tk.bubbles) b.pos.y -= b.rise * dt;
  tk.bubbles = tk.bubbles.filter((b) => { if (b.pos.y < SURFACE_Y + 1) { ripple(tk, b.pos.x, 0.5); return false; } return true; });

  // 4) particles
  for (const p of tk.particles) {
    if (p.kind === "drop") p.vel.y += GRAVITY * dt;
    else if (p.kind === "bubble") { p.vel.y -= 40 * dt; p.vel.x *= 1 - 1.5 * dt; }
    else { p.vel.x *= 1 - 2.5 * dt; p.vel.y *= 1 - 2.5 * dt; }
    p.pos.x += p.vel.x * dt; p.pos.y += p.vel.y * dt; p.life -= dt;
    if (p.kind === "drop" && p.vel.y > 0 && p.pos.y > SURFACE_Y + 1) { p.life = 0; ripple(tk, p.pos.x, 0.35); }
    if (p.kind === "bubble" && p.pos.y < SURFACE_Y + 1) p.life = 0;
  }
  tk.particles = tk.particles.filter((p) => p.life > 0 && p.pos.x > -10 && p.pos.x < W + 10 && p.pos.y < H + 10);
  tk.ripples = tk.ripples.filter((r) => tk.time - r.t0 < 3.5);

  // 5) plankton drift
  for (const p of tk.plankton) {
    p.pos.x = (p.pos.x + p.vel.x * dt + W) % W;
    p.pos.y = SURFACE_Y + ((p.pos.y - SURFACE_Y + p.vel.y * dt + (H - SURFACE_Y)) % (H - SURFACE_Y));
  }
  tk.time += dt;
}

const seaweedSway = (hf, t, ph) =>
  T.seaweedSwayAmp * hf * hf * (0.7 * Math.sin(TAU * T.seaweedHz[0] * t + ph) + 0.3 * Math.sin(TAU * T.seaweedHz[1] * t + 1.7 * ph));

// Points spaced `spacing` px apart along the path the head has travelled (head first).
function bodyPoints(f, n, spacing) {
  const pts = [v(f.pos.x, f.pos.y)];
  let prev = pts[0], need = spacing;
  for (let i = f.hist.length - 1; i >= 0 && pts.length < n; i--) {
    const p = f.hist[i];
    let seg = Math.hypot(prev.x - p.x, prev.y - p.y);
    while (seg >= need && pts.length < n) {
      const t = need / seg, q = v(prev.x + (p.x - prev.x) * t, prev.y + (p.y - prev.y) * t);
      pts.push(q); prev = q; seg -= need; need = spacing;
    }
    need -= seg; prev = p;
  }
  const back = len(f.vel) > 1e-3 ? norm(f.vel) : v(f.facingRight ? 1 : -1, 0);
  while (pts.length < n) { const l = pts[pts.length - 1]; pts.push(v(l.x - back.x * spacing, l.y - back.y * spacing)); }
  return pts;
}

// ================================================================ rendering
const canvas = document.getElementById("tank");
const ctx = canvas.getContext("2d");
let SCALE = 3, pixelMode = false;
function setResolution(pixel) {
  pixelMode = pixel; SCALE = pixel ? 1 : 3;
  canvas.width = W * SCALE; canvas.height = H * SCALE;
  canvas.classList.toggle("pixel", pixel);
  ctx.setTransform(SCALE, 0, 0, SCALE, 0, 0);
  ctx.fillStyle = "#000"; ctx.fillRect(0, 0, W, H);
}
const P = (x) => (pixelMode ? Math.round(x) : x);

let palHsl = [];
function refreshPalettes() { palHsl = palettes.map(([a, b]) => [hexToHsl(a), hexToHsl(b)]); }
const sceneHsl = {};
function refreshScene() { for (const k in scene) sceneHsl[k] = hexToHsl(scene[k]); }

function fishCharColor(f, j, n, t) {
  const [a, b] = palHsl[f.pal % palHsl.length];
  const u = n > 1 ? j / (n - 1) : 0, d = DEPTH[f.layer];
  let h = lerpHue(a[0], b[0], u), s = a[1] + (b[1] - a[1]) * u, l = a[2] + (b[2] - a[2]) * u;
  h = lerpHue(h, 215, d.blue);
  s = s * d.s * T.vibrance;
  l = l * d.l + T.shimmer * Math.sin(t * 3.1 - j * 0.85 + f.id * 1.7) * d.l;
  return hsl(h, s, l);
}

function draw(tk) {
  const t = tk.time;
  // Full clear to true black every frame. (A partial-alpha fade for trails never reaches 0:
  // 8-bit rounding leaves faint gray residue, which shows up as haze in the reflection.)
  ctx.fillStyle = "#000";
  ctx.fillRect(0, 0, W, H);
  ctx.textAlign = "center"; ctx.textBaseline = "middle";

  // plankton: faint twinkling specks for depth
  if (T.plankton) {
    ctx.font = "6px monospace";
    const [ph, ps, pl] = sceneHsl.plankton;
    for (const p of tk.plankton) ctx.fillStyle = hsl(ph, ps, pl * (0.55 + 0.45 * Math.sin(t * 1.7 + p.phase))), ctx.fillText(".", P(p.pos.x), P(p.pos.y));
  }

  // seaweed: dark at the root, bright at the tip
  ctx.font = "8px monospace";
  const [bh, bs, bl] = sceneHsl.seaweedBase, [th, ts, tl] = sceneHsl.seaweedTip;
  for (const s of tk.seaweed) {
    const segs = Math.max(2, Math.floor(s.height / SEAWEED_SEG_PX));
    for (let i = 0; i < segs; i++) {
      const hf = i / (segs - 1);
      ctx.fillStyle = hsl(lerpHue(bh, th, hf), (bs + (ts - bs) * hf) * T.vibrance, bl + (tl - bl) * hf * 0.85);
      ctx.fillText(i % 2 ? ")" : "(", P(s.x + seaweedSway(hf, t, s.phase)), P(H - 4 - i * SEAWEED_SEG_PX));
    }
  }

  // fish, far → near; every character follows the head's path with a travelling body wave
  for (let L = 0; L < 3; L++) {
    const fp = FONT_PX[L], adv = fp * 0.62;
    ctx.font = `bold ${fp}px monospace`;
    for (const f of tk.fish) {
      if (f.layer !== L) continue;
      const g = SPECIES[L];
      const headFirst = f.facingRight ? [...g.right].reverse() : [...g.left];
      const n = headFirst.length, wake = f.airborne ? 0 : T.wakeLength;
      const pts = bodyPoints(f, n + wake, adv);
      // wake: fading dots along the path behind the tail, in the tail's color
      if (wake > 0) {
        ctx.font = `${Math.max(6, fp - 3)}px monospace`;
        const [, b] = palHsl[f.pal % palHsl.length], d = DEPTH[L];
        for (let k = 1; k <= wake; k++) {
          const p = pts[n - 1 + k], fade = 1 - k / (wake + 1);
          ctx.fillStyle = hsl(lerpHue(b[0], 215, d.blue), b[1] * d.s * T.vibrance, b[2] * d.l * 0.55 * fade);
          ctx.fillText(k % 3 === 0 ? "-" : ".", P(p.x), P(p.y + Math.sin(f.wavePhase - (n + k) * 0.9) * T.bodyWaveAmp * 0.6));
        }
        ctx.font = `bold ${fp}px monospace`;
      }
      for (let j = 0; j < n; j++) {
        const a = pts[Math.max(0, j - 1)], b = pts[Math.min(n - 1, j + 1)];
        const dir = norm(v(a.x - b.x, a.y - b.y)), perp = v(-dir.y, dir.x);
        const off = T.bodyWaveAmp * Math.pow(j / (n - 1), 1.3) * Math.sin(f.wavePhase - j * 0.9);
        ctx.fillStyle = fishCharColor(f, j, n, t);
        ctx.fillText(headFirst[j], P(pts[j].x + perp.x * off), P(pts[j].y + perp.y * off));
      }
    }
  }

  // ambient bubbles
  ctx.font = "8px monospace";
  const [uh, us, ul] = sceneHsl.bubble;
  ctx.fillStyle = hsl(uh, us, ul * 0.8);
  for (const b of tk.bubbles) {
    const x = b.pos.x + T.bubbleWobbleAmp * Math.sin(TAU * T.bubbleWobbleHz * t + b.phase);
    ctx.fillText("o", P(x), P(b.pos.y));
  }

  // splash particles (fade toward black = invisible in the reflection)
  for (const p of tk.particles) {
    const k = clamp(p.life / p.max, 0, 1);
    const [h, s, l] = hexToHsl(p.color);
    ctx.font = p.kind === "drop" ? "bold 8px monospace" : "7px monospace";
    ctx.fillStyle = hsl(h, s * T.vibrance, l * (0.25 + 0.75 * k));
    ctx.fillText(p.ch, P(p.pos.x), P(p.pos.y));
  }

  // water surface
  ctx.font = "bold 8px monospace";
  const [sh, ss, sl] = sceneHsl.surface;
  for (let x = 2; x < W; x += 5) {
    const y = surfaceAt(tk, x), lift = clamp((SURFACE_Y - y) / 3, -1, 1);
    ctx.fillStyle = hsl(sh, ss * T.vibrance, sl * (0.55 + 0.35 * lift));
    ctx.fillText("~", P(x), P(y));
  }
}

// ================================================================ controls
const $ = (id) => document.getElementById(id);
const fmt = (x) => (Number.isInteger(x) ? String(x) : String(+x.toFixed(3)));

function slider(label, value, f, onInput) {
  const row = document.createElement("div"); row.className = "row";
  row.innerHTML = `<label title="${label}">${label}</label><input type="range"><output></output>`;
  const input = row.querySelector("input"), out = row.querySelector("output");
  Object.assign(input, { min: f.min, max: f.max, step: f.step, value });
  out.textContent = fmt(value);
  input.addEventListener("input", () => { const x = f.int ? parseInt(input.value, 10) : parseFloat(input.value); out.textContent = fmt(x); onInput(x); });
  return row;
}

function buildControls() {
  const host = $("controls"); host.innerHTML = "";
  const groups = {};
  for (const f of FIELDS) {
    if (!groups[f.g]) {
      const fs = document.createElement("fieldset"); if (f.fx) fs.className = "fx";
      fs.innerHTML = `<legend>${f.g}${f.fx ? " · new" : ""}</legend>`; host.appendChild(fs); groups[f.g] = fs;
    }
    const changed = () => { if (f.respawn) tank = makeTank(seed); refreshExport(); save(); };
    if (Array.isArray(f.def)) f.sub.forEach((name, i) => groups[f.g].appendChild(slider(`${f.k}[${name}]`, T[f.k][i], f, (x) => { T[f.k][i] = x; changed(); })));
    else groups[f.g].appendChild(slider(f.k, T[f.k], f, (x) => { T[f.k] = x; changed(); }));
  }

  const ph = $("palettes"); ph.innerHTML = "";
  const names = ["neon tetra", "betta", "goldfish", "clownfish", "lime", "coral", "sky"];
  palettes.forEach((pal, i) => {
    const row = document.createElement("div"); row.className = "pal";
    row.innerHTML = `<span>${names[i] || "palette " + i}</span><input type="color"><input type="color"><div class="swatch"></div>`;
    const [a, b] = row.querySelectorAll("input"), sw = row.querySelector(".swatch");
    const paint = () => { sw.style.background = `linear-gradient(90deg, ${pal[0]}, ${pal[1]})`; };
    a.value = pal[0]; b.value = pal[1]; paint();
    a.addEventListener("input", () => { pal[0] = a.value; paint(); refreshPalettes(); refreshExport(); save(); });
    b.addEventListener("input", () => { pal[1] = b.value; paint(); refreshPalettes(); refreshExport(); save(); });
    ph.appendChild(row);
  });

  const ch = $("colors"); ch.innerHTML = "";
  for (const k of Object.keys(DEFAULT_SCENE)) {
    const row = document.createElement("div"); row.className = "row";
    row.innerHTML = `<label>${k}</label><input type="color"><output></output>`;
    const input = row.querySelector("input"); input.value = scene[k];
    input.addEventListener("input", () => { scene[k] = input.value; refreshScene(); refreshExport(); save(); });
    ch.appendChild(row);
  }
}

// ================================================================ export
const toRgb565 = (hex) => {
  const n = parseInt(hex.slice(1), 16), r = (n >> 16) & 255, g = (n >> 8) & 255, b = n & 255;
  return "0x" + (((r >> 3) << 11) | ((g >> 2) << 5) | (b >> 3)).toString(16).toUpperCase().padStart(4, "0");
};
const cf = (x) => { const s = String(+x.toFixed(3)); return (s.includes(".") ? s : s + ".0") + "f"; };
function fieldLines(list) {
  const w = Math.max(...list.map((f) => f.k.length));
  return list.map((f) => {
    const val = Array.isArray(f.def) ? `{${T[f.k].map((x) => (f.int ? String(x) : cf(x))).join(", ")}}` : (f.int ? String(T[f.k]) : cf(T[f.k]));
    return `    /* ${f.k.padEnd(w)} */ ${val},`;
  });
}
function exportText() {
  return [
    "// lib/tanksim/tuning.h — values in tank::Tuning field order (DESIGN §6)",
    "constexpr tank::Tuning kTuning{",
    ...fieldLines(FIELDS.filter((f) => !f.fx)),
    "};",
    "",
    "// DRAFT look v2 fields (flow, color, splashes). Not in tank::Tuning yet: pending DESIGN update.",
    "constexpr FxTuning kFx{",
    ...fieldLines(FIELDS.filter((f) => f.fx)),
    "};",
    "",
    "// src/render/palette.h — RGB565",
    `constexpr uint16_t kFishPalette[${palettes.length}][2] = {  // {head, tail}`,
    ...palettes.map((p) => `    {${toRgb565(p[0])}, ${toRgb565(p[1])}},`),
    "};",
    ...Object.keys(scene).map((k) => `constexpr uint16_t k${k[0].toUpperCase() + k.slice(1)}Color = ${toRgb565(scene[k])};`),
    "",
    `// tuned with seed ${seed}`,
  ].join("\n");
}
function refreshExport() { $("export").value = exportText(); }

// ================================================================ wiring
let tank;
refreshPalettes(); refreshScene();
setResolution(false);
tank = makeTank(seed);
buildControls(); refreshExport();

$("pixel").addEventListener("change", (e) => setResolution(e.target.checked));
$("mirror").addEventListener("change", (e) => canvas.classList.toggle("mirror", e.target.checked));
$("leap").addEventListener("click", () => tryAutoLeap(tank));
$("reseed").addEventListener("click", () => { seed = (Math.random() * 0xFFFFFFFF) >>> 0; tank = makeTank(seed); refreshExport(); save(); });
$("reset").addEventListener("click", () => {
  T = defaultsT(); palettes = clone(DEFAULT_PALETTES); scene = clone(DEFAULT_SCENE);
  refreshPalettes(); refreshScene(); tank = makeTank(seed); buildControls(); refreshExport(); save();
});
$("copy").addEventListener("click", async () => {
  const text = exportText();
  try { await navigator.clipboard.writeText(text); $("copied").textContent = "Copied to clipboard."; }
  catch (_) { $("export").select(); $("copied").textContent = "Clipboard blocked: text selected, press ⌘/Ctrl+C."; }
});
canvas.addEventListener("pointerdown", (e) => {
  const r = canvas.getBoundingClientRect();
  let x = (e.clientX - r.left) / r.width * W;
  const y = (e.clientY - r.top) / r.height * H;
  if (canvas.classList.contains("mirror")) x = W - x;
  if (y < SURFACE_Y + 14) splash(tank, x, 70, palettes[tank.rng.int(palettes.length)][0]);
  else burst(tank, x, y);
});

// ================================================================ loop
let last = performance.now(), acc = 0, fps = 60, hudAt = 0;
function frame(now) {
  const elapsed = (now - last) / 1000; last = now;
  acc += elapsed;
  let n = Math.floor(acc / STEP);
  if (n > MAX_STEPS) { n = MAX_STEPS; acc = 0; } else { acc -= n * STEP; }
  for (let i = 0; i < n; i++) step(tank, STEP);
  draw(tank);
  if (elapsed > 0) fps = fps * 0.95 + (1 / elapsed) * 0.05;
  if (now - hudAt > 250) {
    hudAt = now;
    $("fps").textContent = fps.toFixed(0); $("nfish").textContent = tank.fish.length;
    $("npart").textContent = tank.particles.length; $("seed").textContent = seed;
  }
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);

window.__tuner = { get tank() { return tank; }, get T() { return T; }, get fps() { return fps; }, exportText, step, leap: () => tryAutoLeap(tank), burst: (x, y) => burst(tank, x, y) };
</script>
</body>
</html>
