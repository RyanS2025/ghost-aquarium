name: CI

on:
  push:
  pull_request:

# Least privilege: the workflow only reads the repo.
permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Cache PlatformIO
        uses: actions/cache@v4
        with:
          path: ~/.platformio
          key: pio-${{ runner.os }}-${{ hashFiles('platformio.ini') }}

      - name: Install PlatformIO
        run: pip install platformio

      - name: Simulation unit tests (laptop)
        run: pio test -e native

      - name: Firmware build (ESP32-S3)
        run: pio run -e esp32s3

  # Boots the real firmware in the Wokwi simulator and waits for the stats line.
  # Runs only when the repo has a WOKWI_CLI_TOKEN secret (free: https://wokwi.com/dashboard/ci).
  simulate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Cache PlatformIO
        uses: actions/cache@v4
        with:
          path: ~/.platformio
          key: pio-${{ runner.os }}-${{ hashFiles('platformio.ini') }}

      - name: Install PlatformIO
        run: pip install platformio

      - name: Build firmware for the simulator (ILI9341 panel, un-mirrored)
        run: pio run -e esp32s3
        env:
          PLATFORMIO_BUILD_FLAGS: -DGHOST_MIRROR=0 -DGHOST_PANEL_SIM=1

      # Only reports whether the secret exists; the token itself goes to the Wokwi step alone.
      - name: Check for a Wokwi token
        id: wokwi
        env:
          TOKEN: ${{ secrets.WOKWI_CLI_TOKEN }}
        run: echo "enabled=$([ -n "$TOKEN" ] && echo true || echo false)" >> "$GITHUB_OUTPUT"

      - name: Run in Wokwi (expects an fps= stats line)
        if: steps.wokwi.outputs.enabled == 'true'
        uses: wokwi/wokwi-ci-action@09e807a07e05b6f2498e43e3fb7ffcf38c277af7 # v1 (pinned commit)
        with:
          token: ${{ secrets.WOKWI_CLI_TOKEN }}
          timeout: 20000
          expect_text: "fps="
          serial_log_file: wokwi-serial.log

      - name: Upload serial log
        if: always() && steps.wokwi.outputs.enabled == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: wokwi-serial-log
          path: wokwi-serial.log
          if-no-files-found: ignore
